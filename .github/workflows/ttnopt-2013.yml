name: TTNOpt historical Heston 2013
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttnopt-2013.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttnopt-heston-2013
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install committed TTNOpt and prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tensor network/TTNOpt"
      - name: Smoke test first historical state
        run: |
          python "tensor network/run_ttnopt_2013.py" --start 0 --stop 1 --bonds 2 --sweeps 2 --out "/tmp/ttnopt_smoke_2013"
          cat /tmp/ttnopt_smoke_2013/summary.json
      - name: Run TTNOpt on all 250 historical states
        run: |
          python "tensor network/run_ttnopt_2013.py" --start 0 --stop 250 --bonds 2 4 --sweeps 4
      - name: Commit TTNOpt results to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "tensor network/ttnopt_results_2013"
          if ! git diff --cached --quiet; then
            git commit -m "Record TTNOpt topology optimisation across 250 Heston states"
            git push origin HEAD:main
          fi
      - name: Upload results even if optimisation failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttnopt-2013-results
          path: |
            tensor network/ttnopt_results_2013/
            /tmp/ttnopt_smoke_2013/
          if-no-files-found: warn
